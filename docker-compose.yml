services:
  priospace:
    build:
      context: ../..  # 使用 monorepo 根目录作为构建上下文（为了访问 packages/auth-sdk）
      dockerfile: apps/taskspace/Dockerfile  # 指定 Dockerfile 位置
      args:
        # NEXT_PUBLIC_* 必须在构建期传入，运行时 environment/env_file 对已打包的前端代码不生效
        # docker-compose 会从同目录的 .env.local 或当前 shell 环境读取这些变量
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://kong-tencent.wonlab.top}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        - NEXT_PUBLIC_APP_KEY=${NEXT_PUBLIC_APP_KEY:-}
    ports:
      - "127.0.0.1:11010:3000"
    env_file:
      - .env.local  # 从 .env.local 文件读取运行时环境变量
    environment:
      - NODE_ENV=production
      - BACKUP_DIR=/app/data/backups
      - NEXT_PUBLIC_ENABLE_SERVER_BACKUP=true
    volumes:
      # Data persistence using local directory (easy to access and backup)
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - priospace-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  priospace-network:
    driver: bridge
